<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WordLearner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4CAF50"/>
      <stop offset="1" stop-color="#2196F3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f4"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- sparkles -->
  <path d="M396 104 Q396 146 438 146 Q396 146 396 188 Q396 146 354 146 Q396 146 396 104 Z" fill="url(#star)"/>
  <path d="M344 96 Q344 118 366 118 Q344 118 344 140 Q344 118 322 118 Q344 118 344 96 Z" fill="#FFECB3"/>
  <path d="M438 190 Q438 205 453 205 Q438 205 438 220 Q438 205 423 205 Q438 205 438 190 Z" fill="#FFECB3"/>

  <!-- open book -->
  <g>
    <!-- left page -->
    <path d="M253 206 C224 188 168 185 116 198 L116 356 C168 343 224 346 253 364 Z" fill="url(#page)"/>
    <!-- right page -->
    <path d="M259 206 C288 188 344 185 396 198 L396 356 C344 343 288 346 259 364 Z" fill="url(#page)"/>
    <!-- spine gap shadow -->
    <path d="M253 206 L256 364 L259 206 Z" fill="#cbd5dd" opacity="0.7"/>

    <!-- text lines: left page -->
    <g stroke="#81C784" stroke-width="10" stroke-linecap="round">
      <line x1="140" y1="232" x2="228" y2="228"/>
      <line x1="140" y1="260" x2="210" y2="256"/>
      <line x1="140" y1="288" x2="222" y2="284"/>
    </g>
    <!-- text lines: right page -->
    <g stroke="#64B5F6" stroke-width="10" stroke-linecap="round">
      <line x1="284" y1="228" x2="372" y2="232"/>
      <line x1="284" y1="256" x2="352" y2="260"/>
      <line x1="284" y1="284" x2="364" y2="288"/>
    </g>

    <!-- bottom cover edge -->
    <path d="M116 356 C168 343 224 346 253 364 L259 364 C288 346 344 343 396 356 L396 374 C344 361 288 364 259 382 L253 382 C224 364 168 361 116 374 Z" fill="#e3e8ec"/>
  </g>
</svg>
